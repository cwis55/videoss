<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>생생 카드뉴스 템플릿</title>
<style>
@font-face { font-family: 'Pretendard'; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 900; src: url(fonts/Pretendard-Black.woff2) format('woff2'); }
@font-face { font-family: 'Jua'; src: url(fonts/Jua-Regular.ttf) format('truetype'); }

/* ── 생생 브랜드 컬러 (마스코트 젤리에서 추출) ── */
:root {
  --jelly: #FFC61E;      /* 메인 노랑 */
  --orange: #FF8A00;     /* 강조 주황 */
  --deep: #F25C05;       /* 할인·경고 */
  --cream: #FFF6DC;      /* 정보 패널 */
  --choco: #2B1608;      /* 본문 글자, 어두운 배경 */
  --white: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; font-family: 'Pretendard', sans-serif; color: var(--choco);
  display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }

.card { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--choco);
  word-break: keep-all; }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.bg svg, .bg video { width: 100%; height: 100%; display: block; object-fit: cover; }
/* 영상 합성용: 배경을 비우고 글자·장식만 남김 */
.overlay-only .bg { display: none; }
.overlay-only { background: transparent !important; }
body:has(.overlay-only) { background: transparent; }
.shade { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(43,22,8,.55) 0%, rgba(43,22,8,0) 18%, rgba(43,22,8,0) 45%, rgba(43,22,8,.92) 82%, rgba(43,22,8,.98) 100%); }

/* 상단 바: 프로필 + 페이지 번호 (예시4 루루코) */
.top { position: absolute; top: 44px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.brand { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 8px 26px 8px 8px; }
.brand img { width: 60px; height: 60px; border-radius: 50%; }
.brand b { font-family: 'Jua'; font-weight: 400; font-size: 34px; color: var(--choco); }
.page { margin-left: auto; font-weight: 800; font-size: 28px; color: var(--white); background: rgba(43,22,8,.55); border-radius: 999px; padding: 10px 22px; letter-spacing: .04em; }
.page i { font-style: normal; color: var(--jelly); }

/* 하단 텍스트 블록 */
.copy { position: absolute; left: 72px; right: 72px; bottom: 150px; z-index: 4; }
.eyebrow { display: inline-block; background: var(--jelly); color: var(--choco); font-weight: 800; font-size: 32px; border-radius: 14px; padding: 10px 20px; margin-bottom: 28px; }
.headline { font-weight: 900; font-size: 92px; line-height: 1.16; letter-spacing: -0.035em; color: var(--white); text-shadow: 0 4px 24px rgba(0,0,0,.35); }
.headline em, .title em { font-style: normal; color: var(--jelly); }
.body { margin-top: 30px; font-weight: 500; font-size: 36px; line-height: 1.5; color: rgba(255,255,255,.88); }

/* 하단 워터마크 + 넘기기 신호 */
.foot { position: absolute; left: 72px; right: 48px; bottom: 52px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
.handle { font-weight: 700; font-size: 28px; color: rgba(255,255,255,.7); }
.next { font-weight: 800; font-size: 28px; color: var(--choco); background: var(--jelly); border-radius: 999px; padding: 12px 26px; }

/* 표지 전용: 마스코트 스티커 + 말풍선 */
.cover .copy { bottom: 190px; right: 330px; }
.cover .headline { font-size: 104px; }
.sticker { position: absolute; right: 26px; bottom: 70px; width: 330px; z-index: 6; filter: drop-shadow(0 12px 22px rgba(0,0,0,.35)); transform: rotate(-6deg); }
.bubble { position: absolute; right: 150px; bottom: 360px; z-index: 7; font-family: 'Jua'; font-size: 44px; color: var(--choco); background: var(--white); border-radius: 36px; padding: 16px 30px; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
.bubble::after { content: ''; position: absolute; right: 70px; bottom: -22px; border: 14px solid transparent; border-top: 18px solid var(--white); border-bottom: 0; }

/* 게임 정보 카드 (예시1 게임서랍장 + 예시2 게임큐레이션 가격 표기) */
.game .bg { bottom: 560px; }
.game .shade { background: linear-gradient(180deg, rgba(43,22,8,.5) 0%, rgba(43,22,8,0) 20%); bottom: 560px; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; background: var(--cream); border-radius: 48px 48px 0 0; padding: 64px 72px 0; z-index: 4; }
.num { position: absolute; top: -56px; left: 72px; width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE27A, var(--jelly) 55%, var(--orange)); color: var(--choco); font-weight: 900; font-size: 50px; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(242,92,5,.35); }
.title { font-weight: 900; font-size: 68px; letter-spacing: -0.03em; line-height: 1.15; margin-top: 18px; }
.chips { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.chip { font-weight: 700; font-size: 27px; border-radius: 12px; padding: 8px 16px; background: var(--white); border: 2px solid rgba(43,22,8,.12); }
.chip.ok { background: #E6F7D9; border-color: #9FD27A; color: #2E6B12; }
.price { display: flex; align-items: center; gap: 20px; margin-top: 30px; }
.price s { font-weight: 700; font-size: 36px; color: rgba(43,22,8,.4); }
.price strong { font-weight: 900; font-size: 60px; color: var(--deep); letter-spacing: -0.02em; }
.price .off { font-weight: 900; font-size: 32px; color: var(--white); background: var(--deep); border-radius: 12px; padding: 6px 14px; }
.panel .desc { margin-top: 24px; font-weight: 500; font-size: 33px; line-height: 1.5; color: rgba(43,22,8,.85); }
.game .foot .handle { color: rgba(43,22,8,.45); }

/* 저장각 체크리스트 카드 */
.yellow { background: var(--jelly); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.35) 3px, transparent 3.5px); background-size: 44px 44px; }
.yellow .top .page { background: rgba(43,22,8,.85); }
.check-wrap { position: absolute; left: 72px; right: 72px; top: 190px; z-index: 4; }
.check-wrap .eyebrow { background: var(--choco); color: var(--jelly); }
.check-wrap .headline { color: var(--choco); text-shadow: none; font-size: 84px; }
.check-wrap .headline em { color: var(--white); -webkit-text-stroke: 0; background: var(--choco); padding: 0 14px; border-radius: 14px; }
.list { margin-top: 48px; background: var(--white); border-radius: 36px; padding: 24px 44px; box-shadow: 0 16px 0 rgba(43,22,8,.12); }
.list li { list-style: none; display: flex; gap: 24px; align-items: center; font-weight: 700; font-size: 40px; padding: 34px 0; border-bottom: 2px dashed rgba(43,22,8,.12); }
.list li:last-child { border-bottom: 0; }
.list li::before { content: '✓'; flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--jelly); display: grid; place-items: center; font-weight: 900; font-size: 32px; }
.save-tip { margin-top: 48px; font-weight: 800; font-size: 38px; text-align: center; }
.yellow .foot .handle { color: rgba(43,22,8,.55); }
.yellow .foot .next { background: var(--choco); color: var(--jelly); }

/* 마지막 CTA 카드 (예시3 너겟 이벤트 + 예시4 공유 문구) */
.cta-wrap { position: absolute; left: 72px; right: 72px; top: 140px; bottom: 120px; z-index: 4; text-align: center; display: flex; flex-direction: column; justify-content: center; }
.cta-wrap .lead { font-weight: 800; font-size: 46px; }
.cta-wrap .headline { color: var(--choco); text-shadow: none; font-size: 96px; margin-top: 10px; }
.cta-wrap .headline em { color: var(--deep); }
.hero { width: 500px; margin: 30px auto 0; display: block; filter: drop-shadow(0 18px 24px rgba(242,92,5,.35)); }
.follow { width: 100%; display: flex; align-items: center; gap: 24px; background: var(--white); border-radius: 999px; padding: 18px 18px 18px 18px; margin: 34px auto 0; text-align: left; box-shadow: 0 14px 0 rgba(43,22,8,.12); }
.follow img { width: 104px; height: 104px; border-radius: 50%; }
.follow .who { flex: 1; }
.follow .who b { display: block; font-weight: 900; font-size: 42px; }
.follow .who span { font-weight: 500; font-size: 28px; color: rgba(43,22,8,.6); }
.follow .btn { font-weight: 900; font-size: 34px; color: var(--white); background: var(--deep); border-radius: 999px; padding: 22px 40px; }
.event { margin-top: 30px; background: var(--choco); color: var(--white); border-radius: 30px; padding: 26px 34px; text-align: left; font-size: 30px; line-height: 1.5; font-weight: 500; }
.event b { color: var(--jelly); font-weight: 900; font-size: 34px; display: block; margin-bottom: 6px; }
.acts { display: flex; justify-content: center; gap: 18px; margin-top: 40px; }
.acts span { font-weight: 800; font-size: 32px; background: rgba(255,255,255,.55); border-radius: 999px; padding: 14px 28px; }
.cta .foot { justify-content: center; }
.cta .foot .handle { color: rgba(43,22,8,.6); }
</style>
</head>
<body>
<script>
/* ===================================================================
   ✏️ 여기만 고치면 됩니다
   - bg: 'images/파일명.jpg' 처럼 게임 스크린샷 경로를 넣으세요.
         'scene:숫자' 는 샘플용 배경(0~3)입니다.
   - *별표* 로 감싼 글자는 노란색 강조가 됩니다.
   - \n 은 줄바꿈입니다.
   - video: 'posts/.../clip.mp4' 를 넣으면 영상 슬라이드(mp4)도 함께 만들어집니다.
   - 게시물별 내용은 posts/<이름>/content.js 에 두고 template.html?post=<이름> 으로 엽니다.
   =================================================================== */
const BRAND = { name: '생생', handle: '@saeng_mag', bio: '말랑하게 씹어먹는 게임 소식' };

let CARDS = [
  { type: 'cover', bg: 'scene:0',
    eyebrow: '🔥 이번 주 스팀 신작',
    headline: '슬라임 키우다가\n*하루 순삭* 각',
    bubble: '넘겨봐!' },

  { type: 'game', bg: 'scene:1', no: '01',
    title: '젤리 목장 이야기',
    chips: ['2026.10.20 출시', '매우 긍정적'], ok: '한국어 지원',
    price: { orig: '22,000원', sale: '15,400원', off: '-30%' },
    desc: '말랑한 슬라임을 모으고 섞어서\n나만의 목장을 키우는 힐링 경영 게임' },

  { type: 'point', bg: 'scene:2',
    eyebrow: 'POINT 1 · 수집',
    headline: '섞을수록\n*새 슬라임*이 튀어나옴',
    body: '조합 120가지 이상, 도감 채우는 재미가 핵심이에요.' },

  { type: 'point', bg: 'scene:3',
    eyebrow: 'POINT 2 · 협동',
    headline: '친구랑 같이 하면\n*난이도 반토막*',
    body: '최대 4인 온라인 협동. 한 명은 먹이, 한 명은 청소 담당!' },

  { type: 'check',
    eyebrow: '📌 저장해두고 꺼내보기',
    headline: '이런 사람한테\n*딱* 맞아요',
    items: ['스타듀밸리처럼 느긋한 게임 좋아함', '귀여운 수집·도감 채우기 덕후', '친구랑 디코 켜고 할 게임 찾는 중', '2만 원 이하로 오래 할 게임 필요'],
    tip: '세일 끝나기 전에 저장 꾹 👆' },

  { type: 'cta',
    lead: '슬라임 좋아하는 친구에게',
    headline: '*이 게임* 보내줘!' },
];
</script>

<script>
/* ===== 이 아래는 건드리지 않아도 됩니다 ===== */
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const rich = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');

// 샘플 배경: 하늘 + 언덕 + 슬라임. 실제 사용 시 스크린샷으로 교체
const PALETTES = [
  ['#7FD3FF', '#FFE3A3', '#8BD46E', '#5DB24A', '#3E8F35'],
  ['#FFB27A', '#FFE7B8', '#F2C46B', '#D99A43', '#A8662A'],
  ['#B9A6FF', '#FFD1E8', '#79C9B5', '#4FA791', '#2F7D6C'],
  ['#2B3A78', '#7A5BC7', '#4E4A9E', '#3A3680', '#24215A'],
];
function scene(i) {
  const [s1, s2, h1, h2, h3] = PALETTES[i % PALETTES.length];
  const slime = (x, y, r, c) => `<g transform="translate(${x} ${y})"><ellipse rx="${r}" ry="${r * .78}" fill="${c}" opacity=".95"/><ellipse cx="${-r * .3}" cy="${-r * .35}" rx="${r * .22}" ry="${r * .14}" fill="#fff" opacity=".6"/><circle cx="${-r * .25}" cy="${-r * .02}" r="${r * .09}" fill="#2B1608"/><circle cx="${r * .25}" cy="${-r * .02}" r="${r * .09}" fill="#2B1608"/><path d="M${-r * .12} ${r * .18} q${r * .12} ${r * .14} ${r * .24} 0" stroke="#2B1608" stroke-width="${r * .05}" fill="none" stroke-linecap="round"/></g>`;
  const stars = i === 3 ? Array.from({ length: 40 }, (_, k) => `<circle cx="${(k * 263) % 1080}" cy="${(k * 97) % 600}" r="${2 + k % 3}" fill="#fff" opacity=".7"/>`).join('') : '';
  return `<svg viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs>
  <rect width="1080" height="1350" fill="url(#sk${i})"/>${stars}
  <circle cx="820" cy="300" r="110" fill="#fff" opacity=".55"/>
  <path d="M0 700 Q270 560 540 680 T1080 640 V1350 H0Z" fill="${h1}"/>
  <path d="M0 860 Q300 740 620 860 T1080 820 V1350 H0Z" fill="${h2}"/>
  <path d="M0 1030 Q360 930 700 1040 T1080 1000 V1350 H0Z" fill="${h3}"/>
  ${slime(260, 800, 70, '#FFC61E')}${slime(470, 860, 46, '#FF8A00')}${slime(760, 780, 58, '#7FE0C2')}${slime(900, 900, 40, '#FF8FB1')}${slime(140, 960, 36, '#B39BFF')}
  <text x="540" y="560" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="30" fill="#2B1608" opacity=".35">샘플 배경 · 게임 스크린샷으로 교체</text></svg>`;
}
const RENDER = new URLSearchParams(location.search).has('render');
const bg = (v, video) => video && !RENDER ? `<div class="bg"><video src="${video}" poster="${v || ''}" muted autoplay loop playsinline></video></div>`
  : v && v.startsWith('scene:') ? `<div class="bg">${scene(+v.slice(6))}</div>` : `<div class="bg" style="background-image:url('${v}')"></div>`;

function build() {
const total = CARDS.length;
const pad = n => String(n).padStart(2, '0');
const topBar = n => `<div class="top"><div class="page"><i>${pad(n)}</i> / ${pad(total)}</div></div>`;
const foot = (n, label = '넘겨보기 →') => `<div class="foot"><span class="handle">${BRAND.handle}</span>${n < total ? `<span class="next">${label}</span>` : ''}</div>`;

const R = {
  cover: (c, n) => `${bg(c.bg, c.video)}<div class="shade"></div>${topBar(n)}
    <div class="copy"><span class="eyebrow">${esc(c.eyebrow)}</span><h1 class="headline">${rich(c.headline)}</h1></div>
    <div class="bubble">${esc(c.bubble)}</div><img class="sticker" src="assets/mascot.png">
    <div class="foot"><span class="handle">${BRAND.handle}</span></div>`,
  game: (c, n) => `${bg(c.bg, c.video)}<div class="shade"></div>${topBar(n)}
    <div class="panel">${c.no ? `<div class="num">${c.no}</div>` : ''}<h2 class="title">${rich(c.title)}</h2>
      <div class="chips">${c.chips.map(t => `<span class="chip">${esc(t)}</span>`).join('')}${c.ok ? `<span class="chip ok">✓ ${esc(c.ok)}</span>` : ''}</div>
      ${c.price ? `<div class="price">${c.price.orig ? `<s>${c.price.orig}</s>` : ''}<strong>${c.price.sale}</strong>${c.price.off ? `<span class="off">${c.price.off}</span>` : ''}</div>` : ''}
      <p class="desc">${rich(c.desc)}</p></div>${foot(n)}`,
  point: (c, n) => `${bg(c.bg, c.video)}<div class="shade"></div>${topBar(n)}
    <div class="copy"><span class="eyebrow">${esc(c.eyebrow)}</span><h2 class="headline">${rich(c.headline)}</h2><p class="body">${rich(c.body)}</p></div>${foot(n)}`,
  check: (c, n) => `<div class="dots"></div>${topBar(n)}
    <div class="check-wrap"><span class="eyebrow">${esc(c.eyebrow)}</span><h2 class="headline">${rich(c.headline)}</h2>
      <ul class="list">${c.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="save-tip">${esc(c.tip)}</p></div>
    ${foot(n)}`,
  cta: (c, n) => `<div class="dots"></div>${topBar(n)}
    <div class="cta-wrap"><p class="lead">${esc(c.lead)}</p><h2 class="headline">${rich(c.headline)}</h2>
      <img class="hero" src="assets/mascot.png">
      <div class="follow"><img src="assets/profile.png"><div class="who"><b>${BRAND.handle}</b><span>${BRAND.name} · ${BRAND.bio}</span></div><span class="btn">팔로우</span></div>
      <div class="acts"><span>📌 저장</span><span>✈️ 공유</span><span>💬 댓글</span></div>
      ${c.event ? `<div class="event"><b>${esc(c.event.title)}</b>${rich(c.event.text)}</div>` : ''}</div>${foot(n)}`,
};
const CLASS = { cover: 'cover', game: 'game', point: 'point', check: 'yellow', cta: 'yellow cta' };
document.body.insertAdjacentHTML('beforeend', CARDS.map((c, i) =>
  `<section class="card ${CLASS[c.type]}"${c.video ? ` data-video="${c.video}"` : ''}>${R[c.type](c, i + 1)}</section>`).join(''));
  // 제목이 칸보다 길어 줄이 넘치면 글자 크기를 줄여서 적어 둔 줄 수(\n)에 맞춤
  document.fonts.ready.then(() => document.querySelectorAll('.headline, .title').forEach(h => {
    const lines = h.querySelectorAll('br').length + 1;
    let size = parseFloat(getComputedStyle(h).fontSize);
    const lh = () => parseFloat(getComputedStyle(h).lineHeight);
    while (h.getBoundingClientRect().height > lines * lh() + 4 && size > 40) h.style.fontSize = `${size -= 3}px`;
  }));
}

const post = new URLSearchParams(location.search).get('post');
if (post) {
  const js = document.createElement('script');
  js.src = `posts/${post}/content.js`;
  js.onload = build;
  js.onerror = () => { throw new Error(`posts/${post}/content.js 를 찾지 못했어요.`); };
  document.body.append(js);
} else build();
</script>
</body>
</html>
