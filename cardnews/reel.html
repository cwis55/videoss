<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>생생 릴스 템플릿</title>
<style>
@font-face { font-family: 'Pretendard'; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
@font-face { font-family: 'Pretendard'; font-weight: 900; src: url(fonts/Pretendard-Black.woff2) format('woff2'); }
@font-face { font-family: 'Jua'; src: url(fonts/Jua-Regular.ttf) format('truetype'); }

/* 카드뉴스와 같은 생생 브랜드 컬러 */
:root {
  --jelly: #FFC61E; --orange: #FF8A00; --deep: #F25C05;
  --cream: #FFF6DC; --choco: #2B1608; --white: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: 'Pretendard', sans-serif; color: var(--choco); }
body.preview { background: #333; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }

/* 1080x1920. 영상은 y=690부터 1080x608 (reel.mjs의 BAND와 같아야 함)
   위 150px, 아래 420px, 오른쪽 140px은 인스타 UI 자리라 비워 둠 */
.scene { width: 1080px; height: 1920px; position: relative; overflow: hidden; word-break: keep-all; }
.preview .scene { background: linear-gradient(#5a4a6a, #2b2233); }
.preview .scene::before { content: '영상 자리'; position: absolute; top: 690px; left: 0; width: 1080px; height: 608px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.5); font: 700 40px Pretendard; display: grid; place-items: center; }
.band-frame { position: absolute; top: 690px; left: 0; width: 1080px; height: 608px; border-top: 8px solid var(--jelly); border-bottom: 8px solid var(--jelly); }

.brand { position: absolute; top: 170px; left: 56px; display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.95); border-radius: 999px; padding: 8px 28px 8px 8px; }
.brand img { width: 64px; height: 64px; border-radius: 50%; }
.brand b { font-family: 'Jua'; font-weight: 400; font-size: 36px; }

.head { position: absolute; left: 56px; right: 56px; top: 290px; height: 380px; display: flex; flex-direction: column; justify-content: flex-end; }
.eyebrow { align-self: flex-start; background: var(--jelly); font-weight: 800; font-size: 36px; border-radius: 14px; padding: 10px 22px; margin-bottom: 22px; }
.headline { font-weight: 900; font-size: 100px; line-height: 1.14; letter-spacing: -0.035em; color: var(--white); text-shadow: 0 6px 28px rgba(0,0,0,.45); }
.headline em { font-style: normal; color: var(--jelly); }

/* 자막 */
.sub { position: absolute; left: 56px; right: 160px; top: 1340px; text-align: center; }
.sub .line { margin-bottom: 26px; }
.sub span { display: inline-block; font-weight: 800; font-size: 50px; line-height: 1.55; color: var(--white); background: rgba(43,22,8,.82); border-radius: 14px; padding: 6px 18px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sub em { font-style: normal; color: var(--jelly); }

/* hook: 마스코트 + 말풍선 */
.sticker { position: absolute; right: 30px; top: 150px; width: 300px; transform: rotate(8deg); filter: drop-shadow(0 12px 22px rgba(0,0,0,.4)); }
.bubble { position: absolute; right: 230px; top: 150px; font-family: 'Jua'; font-size: 44px; background: var(--white); border-radius: 36px; padding: 14px 28px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.hook .head { right: 300px; }

/* info: 영상 아래 정보 카드 */
.info-card { position: absolute; left: 56px; right: 160px; top: 1330px; background: var(--cream); border-radius: 36px; padding: 34px 40px; box-shadow: 0 14px 0 rgba(0,0,0,.25); }
.info-card .chips { display: flex; gap: 12px; flex-wrap: wrap; }
.chip { font-weight: 700; font-size: 30px; border-radius: 12px; padding: 8px 16px; background: var(--white); border: 2px solid rgba(43,22,8,.12); }
.price { display: flex; align-items: center; gap: 18px; margin-top: 20px; }
.price s { font-weight: 700; font-size: 38px; color: rgba(43,22,8,.4); }
.price strong { font-weight: 900; font-size: 68px; color: var(--deep); }
.price .off { font-weight: 900; font-size: 34px; color: var(--white); background: var(--deep); border-radius: 12px; padding: 6px 14px; }

/* outro: 카드뉴스 마지막 장과 같은 노란 화면 */
.outro { background: var(--jelly); }
.outro .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.35) 3px, transparent 3.5px); background-size: 44px 44px; }
.outro-wrap { position: absolute; left: 56px; right: 56px; top: 280px; text-align: center; }
.outro .lead { font-weight: 800; font-size: 50px; }
.outro .headline { color: var(--choco); text-shadow: none; margin-top: 10px; }
.outro .headline em { color: var(--deep); }
.hero { width: 520px; margin: 30px auto 0; display: block; filter: drop-shadow(0 18px 24px rgba(242,92,5,.35)); }
.follow { display: flex; align-items: center; gap: 24px; background: var(--white); border-radius: 999px; padding: 18px; margin-top: 36px; text-align: left; box-shadow: 0 14px 0 rgba(43,22,8,.12); }
.follow img { width: 110px; height: 110px; border-radius: 50%; }
.follow .who { flex: 1; }
.follow .who b { display: block; font-weight: 900; font-size: 44px; }
.follow .who span { font-weight: 500; font-size: 28px; color: rgba(43,22,8,.6); }
.follow .btn { font-weight: 900; font-size: 36px; color: var(--white); background: var(--deep); border-radius: 999px; padding: 24px 40px; }
.promo { display: inline-block; margin-top: 40px; font-weight: 800; font-size: 38px; background: var(--choco); color: var(--jelly); border-radius: 999px; padding: 18px 36px; }
</style>
</head>
<body>
<script>
const BRAND = { name: '생생', handle: '@saeng_mag', bio: '말랑하게 씹어먹는 게임 소식' };
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const rich = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
const brand = `<div class="brand"><img src="assets/profile.png"><b>${BRAND.name}</b></div>`;
const head = s => `<div class="head">${s.eyebrow ? `<span class="eyebrow">${esc(s.eyebrow)}</span>` : ''}<h1 class="headline">${rich(s.headline)}</h1></div>`;
const sub = s => s.sub ? `<div class="sub">${s.sub.split('\n').map(l => `<div class="line"><span>${rich(l)}</span></div>`).join('')}</div>` : '';

const R = {
  hook: s => `${brand}${head(s)}<div class="band-frame"></div>
    <div class="bubble">${esc(s.bubble || '끝까지 봐!')}</div><img class="sticker" src="assets/mascot.png">${sub(s)}`,
  info: s => `${brand}${head(s)}<div class="band-frame"></div>
    <div class="info-card"><div class="chips">${s.chips.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    <div class="price">${s.price.orig ? `<s>${s.price.orig}</s>` : ''}<strong>${s.price.sale}</strong>${s.price.off ? `<span class="off">${s.price.off}</span>` : ''}</div></div>`,
  point: s => `${brand}${head(s)}<div class="band-frame"></div>${sub(s)}`,
  outro: s => `<div class="dots"></div>${brand}
    <div class="outro-wrap"><p class="lead">${esc(s.lead)}</p><h1 class="headline">${rich(s.headline)}</h1>
      <img class="hero" src="assets/mascot.png">
      <div class="follow"><img src="assets/profile.png"><div class="who"><b>${BRAND.handle}</b><span>${BRAND.name} · ${BRAND.bio}</span></div><span class="btn">팔로우</span></div>
      ${s.promo ? `<span class="promo">${esc(s.promo)}</span>` : ''}</div>`,
};

function build() {
  if (!new URLSearchParams(location.search).has('render')) document.body.classList.add('preview');
  document.body.insertAdjacentHTML('beforeend', REEL.scenes.map(s =>
    `<section class="scene ${s.type}">${R[s.type](s)}</section>`).join(''));
}

const post = new URLSearchParams(location.search).get('post');
const js = document.createElement('script');
js.src = `posts/${post}/reel.js`;
js.onload = build;
js.onerror = () => { throw new Error(`posts/${post}/reel.js 를 찾지 못했어요.`); };
document.body.append(js);
</script>
</body>
</html>
